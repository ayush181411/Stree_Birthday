<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Karla:wght@400;500&family=Fraunces:wght@600&family=Caveat:wght@600&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#6d1a47; --dusk:#c23073; --ember:#ff6f9f; --glow:#ffd6e4; --rose:#ffb3cb; --paper:#fff6f9; --ink:#5c1038;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Karla',system-ui,sans-serif;color:var(--paper);overflow:hidden;
  background:radial-gradient(130% 100% at 50% 0%,#f06a9f 0%,var(--dusk) 52%,var(--night) 100%);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fx{z-index:50}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s;z-index:5}
.scene.on{opacity:1;visibility:visible}
h1,h2{font-family:'Cormorant Garamond',serif;font-weight:700;line-height:1.1}
h1{font-size:clamp(2.4rem,9vw,4.6rem)}
h2{font-size:clamp(1.7rem,6vw,2.6rem);font-style:italic;font-weight:500}
.hint{margin-top:22px;font-size:.95rem;color:var(--glow);opacity:.85;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
button{font:inherit;cursor:pointer;border:0}
.btn{margin-top:28px;padding:13px 30px;border-radius:999px;background:var(--glow);color:var(--ink);font-weight:500;
  transition:transform .2s,box-shadow .2s;box-shadow:0 0 24px rgba(255,170,205,.5)}
.btn:hover{transform:scale(1.05)}
.btn:focus-visible,.candle:focus-visible,.polaroid:focus-visible{outline:3px solid var(--glow);outline-offset:4px}

/* Scene 0: envelope home */
#s0,#sp,#si,#sl,#sc{background:linear-gradient(160deg,#fdf4f7 0%,#f0e6ec 60%,#e9dde6 100%);color:#2a2230;justify-content:flex-start;
  padding-top:calc(36px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.badge{padding:9px 18px;border-radius:12px;background:rgba(255,255,255,.75);font-size:.68rem;letter-spacing:.22em;color:#6b5a66;
  box-shadow:0 4px 14px rgba(120,60,90,.08);text-transform:uppercase}
.badge span{color:#d6336c;margin-right:8px}
.hello{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(2.2rem,9vw,3.4rem);margin-top:22px;color:#2a2230}
.hb{font-family:'Caveat',cursive;font-weight:600;font-size:clamp(1.9rem,7vw,2.6rem);color:#e0668c;margin-top:4px}
.cat{width:110px;height:110px;object-fit:contain;margin-top:18px}
.cat-emoji{font-size:72px;margin-top:18px;animation:dance .6s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-12deg) translateY(0)}to{transform:rotate(12deg) translateY(-10px)}}
.env{margin-top:auto;width:min(78vw,320px);background:none;position:relative;
  filter:drop-shadow(0 18px 18px rgba(150,70,110,.25));animation:float 3.5s ease-in-out infinite}
.env svg{display:block;width:100%;height:auto}
@keyframes float{50%{transform:translateY(-8px) rotate(-1deg)}}
.env.open{animation:pop .5s ease}
.env.open .sealg{transform-origin:160px 112px;animation:crack .6s forwards}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes crack{to{transform:scale(1.6);opacity:0}}
.tap{margin-top:26px;font-size:.68rem;letter-spacing:.22em;color:#7a6772}

/* Passcode page */
#sp{justify-content:center;overflow-y:auto}
#passTitle{margin-top:6px}
#passHint{font-size:1.4rem;line-height:1.3;max-width:320px;margin-top:8px}
.lockbub{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:2.4rem;
  box-shadow:0 10px 26px rgba(150,70,110,.22);animation:float 3.5s ease-in-out infinite}
.dots{display:flex;gap:16px;margin:20px 0 4px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid #e0668c;transition:background .2s,transform .2s,border-color .2s}
.dots i.f{background:#e0668c;transform:scale(1.12)}
.dots.bad{animation:shake .45s}
.dots.bad i{border-color:#d9455f;background:#ffb8c4}
.dots.ok i{background:#e0668c;border-color:#e0668c;animation:hop .5s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes hop{50%{transform:translateY(-8px)}}
.sad{min-height:96px;margin-top:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;max-width:300px}
.sad.on{opacity:1}
.sad img{width:64px;height:64px;object-fit:contain}
.sad-emoji{font-size:48px;animation:wob 1s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.sad p{font-family:'Caveat',cursive;font-weight:600;font-size:1.3rem;color:#c23073;line-height:1.2;margin-top:2px}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:12px;margin-top:10px}
.pad button{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.88);color:#c23073;font-family:'Quicksand',sans-serif;
  font-weight:600;font-size:1.4rem;box-shadow:0 6px 14px rgba(150,70,110,.18);transition:transform .1s}
.pad button:active{transform:scale(.9)}
.pad .blank{visibility:hidden}

/* Intro questions */
#si{justify-content:center;overflow-y:auto}
.bubble{background:#fff;border-radius:24px 24px 24px 6px;padding:20px 22px 18px;max-width:320px;width:100%;margin-top:16px;
  box-shadow:0 12px 30px rgba(150,70,110,.2);animation:pop .5s ease}
.bubble p{font-family:'Quicksand',sans-serif;font-weight:600;font-size:1.12rem;line-height:1.5;color:#4a3d48}
.row2{display:flex;gap:14px;justify-content:center;margin-top:6px}
.row2 .btn{margin-top:14px;padding:11px 28px;transition:left .25s,top .25s,transform .2s}
.btn.ghost{background:rgba(224,102,140,.14);color:#c23073;box-shadow:none}
#si .btn:not(.ghost){background:#f08fae;color:#fff;box-shadow:0 8px 20px rgba(224,102,140,.4)}

/* Letter page */
#sl{overflow:hidden}
.eb,.ef{position:absolute;left:50%;bottom:6vh;width:min(78vw,300px);transform:translateX(-50%);pointer-events:none}
.eb{z-index:1}.ef{z-index:3}
.eb svg,.ef svg{display:block;width:100%;height:auto;overflow:visible}
.paper{position:absolute;left:50%;top:50%;z-index:2;width:min(86vw,340px);max-height:72vh;overflow-y:auto;
  transform:translate(-50%,calc(-50% + 30vh)) scale(.4);padding:26px 24px 22px;border-radius:6px;color:#5a3a4a;text-align:left;
  background:repeating-linear-gradient(#fffaf0 0 33px,#f6dfe6 33px 34px);box-shadow:0 18px 40px rgba(150,70,110,.28)}
.lt-to{font-family:'Caveat',cursive;font-weight:600;font-size:1.9rem;color:#c23073;margin-bottom:6px}
#ltBody p{font-family:'Caveat',cursive;font-weight:600;font-size:1.4rem;line-height:34px;margin-bottom:10px}
.lt-from{font-family:'Caveat',cursive;font-weight:600;font-size:1.5rem;color:#c23073;text-align:right;margin-top:8px}
.paper .btn{display:block;margin:16px auto 0;background:#f08fae;color:#fff;box-shadow:0 8px 20px rgba(224,102,140,.4)}
.replaybtn{background:#f08fae;color:#fff;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;box-shadow:0 8px 20px rgba(224,102,140,.4)}
.burst{position:fixed;left:0;top:0;z-index:60;opacity:0;pointer-events:none;transform-style:preserve-3d;will-change:transform}
.burst .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px;box-shadow:0 12px 24px rgba(40,0,25,.45)}
.burst .front{background:var(--paper);padding:6px 6px 22px}
.burst .front img{display:block;width:100%;height:100%;object-fit:cover}
.burst .back{background:#f4ece0;transform:rotateX(180deg)}

/* Choose your cake */
#sc{justify-content:center;overflow-y:auto}
#sc h2{color:#c23073;font-size:clamp(1.8rem,7vw,2.6rem)}
.cakegrid{display:grid;grid-template-columns:repeat(2,minmax(0,150px));gap:14px;margin-top:16px}
.cakecard{background:rgba(255,255,255,.92);border-radius:20px;padding:12px 8px;box-shadow:0 10px 24px rgba(150,70,110,.18);
  transition:transform .15s;text-align:center;color:#4a3d48;font-family:'Quicksand',sans-serif;font-weight:600;font-size:.88rem}
.cakecard svg{display:block;width:100%;height:auto;margin-bottom:6px}
.cakecard:hover{transform:translateY(-3px)}
.cakecard.pick{outline:3px solid #f08fae;transform:scale(1.06)}
/* Scene 1: cake */
#s1{padding-top:calc(150px + env(safe-area-inset-top))}
.cake{position:relative;width:240px;height:170px;margin-top:60px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.half{position:absolute;inset:0;transition:transform .9s cubic-bezier(.3,.8,.3,1)}
.half.l{clip-path:inset(0 50% 0 0);transform-origin:50% 100%}
.half.r{clip-path:inset(0 0 0 50%);transform-origin:50% 100%}
.cake.split .half.l{transform:translateX(-20px) rotate(-3deg)}
.cake.split .half.r{transform:translateX(20px) rotate(3deg)}
.candles{position:absolute;top:-6px;left:0;right:0;display:flex;justify-content:center;gap:14px;z-index:1;transition:opacity .6s}
.candles.gone{opacity:0;pointer-events:none}
.half{z-index:1}
.guide{position:absolute;left:119px;top:40px;height:112px;border-left:2px dashed rgba(255,255,255,.75);opacity:0;transition:opacity .4s;z-index:2}
.cutline{position:absolute;left:118px;top:40px;width:4px;height:0;border-radius:4px;background:linear-gradient(#fff,#ffd6e4);
  box-shadow:0 0 10px 3px rgba(255,170,205,.9);z-index:2}
.spark{position:absolute;left:113px;top:34px;width:14px;height:14px;border-radius:50%;background:#fff;
  box-shadow:0 0 16px 8px rgba(255,140,185,.9);opacity:0;z-index:3;pointer-events:none;transition:opacity .4s}
.hand{position:absolute;left:112px;top:24px;font-size:30px;opacity:0;z-index:3;pointer-events:none}
.cake.ready .guide,.cake.ready .spark{opacity:1}
.cake.ready .hand{animation:swipehand 1.5s ease-in-out infinite}
.cake.touched .hand{display:none}
.glow{position:absolute;left:50%;top:40px;width:6px;height:112px;margin-left:-3px;border-radius:50%;opacity:0;z-index:0;
  background:radial-gradient(closest-side,#fff,rgba(255,200,225,.8) 55%,transparent)}
.cake.split .glow{animation:glowup 1.6s ease-out forwards}
.cake.split .cutline,.cake.split .guide,.cake.split .spark,.cake.split .hand{opacity:0}
@keyframes swipehand{0%{transform:translateY(0);opacity:0}15%{opacity:1}80%{transform:translateY(95px);opacity:1}100%{transform:translateY(105px);opacity:0}}
@keyframes glowup{0%{opacity:0;transform:scaleX(1)}30%{opacity:1}100%{opacity:0;transform:scaleX(24)}}
.candle{width:12px;height:46px;border-radius:3px;background:repeating-linear-gradient(45deg,#fff 0 6px,var(--c2,#ff8fa8) 6px 12px);
  position:relative;background-color:#fff}
.candle .flame{position:absolute;left:50%;top:-26px;width:14px;height:24px;margin-left:-7px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;
  background:radial-gradient(circle at 50% 70%,#fff 0,#ffe08a 40%,#ff9a4d 100%);
  box-shadow:0 0 22px 8px rgba(255,190,90,.7);transform-origin:50% 100%;animation:flick .18s infinite alternate;transition:opacity .4s,transform .4s}
.candle.out .flame{opacity:0;transform:scale(.2)}
.candle.out::after{content:"";position:absolute;left:50%;top:-40px;width:4px;height:30px;margin-left:-2px;border-radius:4px;
  background:rgba(255,255,255,.35);filter:blur(3px);animation:smoke 1.6s ease-out forwards}
@keyframes flick{to{transform:scale(1.08,.94) rotate(2deg)}}
@keyframes smoke{from{opacity:.8;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}

/* Scene 2: card page */
#s2{background:radial-gradient(circle at 0 0,#ffcfdc 0,transparent 32%),radial-gradient(circle at 100% 0,#ffe2b5 0,transparent 22%),
  linear-gradient(160deg,#fdf4f7,#f0e6ec 60%,#e9dde6);color:#2a2230;justify-content:flex-start;overflow-y:auto;
  padding-top:calc(28px + env(safe-area-inset-top));padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.cardwrap{margin:auto 0;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}
.card{width:100%;background:rgba(255,255,255,.82);border-radius:28px;padding:22px 20px 20px;
  box-shadow:0 18px 50px rgba(150,70,110,.18);display:flex;flex-direction:column;align-items:center}
.avatar-wrap{width:100px;height:100px;border-radius:50%;background:#fff;padding:5px;box-shadow:0 8px 24px rgba(150,70,110,.22);margin-bottom:14px}
.avatar,.avatar-fb{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff;display:block}
.divider{display:flex;align-items:center;gap:10px;width:100%;margin:14px 0;color:#e0668c}
.divider i{flex:1;border-top:2px dashed #e7b9c8}
.cardtext{font-family:'Quicksand',sans-serif;font-weight:500;font-size:.96rem;line-height:1.7;color:#4a3d48}
.player{display:grid;grid-template-columns:58px 1fr 42px;gap:12px;align-items:center;width:100%;margin-top:18px;
  padding:12px;border-radius:16px;background:#fff;box-shadow:0 6px 18px rgba(150,70,110,.1);text-align:left}
.cover{width:58px;height:58px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#ffd6e4,#ff8fb5);
  display:grid;place-items:center;color:#fff;font-size:1.6rem}
.cover img{width:100%;height:100%;object-fit:cover}
.ptitle{font-family:'Fraunces',serif;font-weight:600;font-size:.92rem;color:#2a2230;line-height:1.2}
.psub{font-size:.6rem;letter-spacing:.2em;color:#e0668c;margin-top:2px}
.bar{height:6px;border-radius:6px;background:#f6d5e0;margin-top:9px;cursor:pointer;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#e0668c;border-radius:6px}
.times{display:flex;justify-content:space-between;font-size:.65rem;color:#9a8a95;margin-top:4px}
.pbtn{width:42px;height:42px;border-radius:50%;background:#e0668c;color:#fff;font-size:.8rem;box-shadow:0 6px 14px rgba(224,102,140,.4)}
.note{font-family:'Caveat',cursive;font-weight:600;font-size:1.25rem;color:#5a4a58;margin-top:14px}

/* Photo banner on the cake page */
.banner{position:absolute;top:calc(6px + env(safe-area-inset-top));left:0;right:0;height:150px;pointer-events:none}
.banner svg{position:absolute;left:0;top:0;overflow:visible}
.hang{position:absolute;padding:0;background:none;transform-origin:50% 0;pointer-events:auto;cursor:pointer;
  animation:sway 3.2s ease-in-out infinite alternate}
.hang .pin{position:absolute;left:50%;top:-7px;width:8px;height:17px;margin-left:-4px;background:#d9a066;border-radius:2px;z-index:2;
  box-shadow:0 1px 2px rgba(0,0,0,.3)}
.hang .pol{display:block;background:var(--paper);padding:4px 4px 12px;box-shadow:0 6px 12px rgba(60,0,30,.35);border-radius:2px}
.hang img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
#lightbox{position:fixed;inset:0;z-index:70;background:rgba(50,0,30,.8);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#lightbox.on{display:flex}
#lightbox img{max-width:86vw;max-height:70vh;border:10px solid var(--paper);border-bottom-width:12px;border-radius:3px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#lightbox p{margin-top:14px;font-family:'Caveat',cursive;font-size:1.5rem}

/* Scene 4 */
#music{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:60;width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.12);color:var(--paper);font-size:1.1rem;display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<section class="scene" id="s0">
  <div class="badge"><span>&#9829;</span><b id="badgeText" style="font-weight:500"></b></div>
  <h1 class="hello" id="helloTitle"></h1>
  <p class="hb"><span id="homeSub"></span> <span>&#9825;</span></p>
  <img id="cat" class="cat" alt="">
  <button class="env" id="envelope" aria-label="Open the envelope">
    <svg viewBox="0 0 320 200" aria-hidden="true">
      <defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf1d9"/><stop offset="1" stop-color="#f1deb4"/></linearGradient></defs>
      <rect x="2" y="2" width="316" height="196" rx="4" fill="url(#eg)" stroke="#b9855a" stroke-width="2"/>
      <path d="M2 198 L135 100 M318 198 L185 100" stroke="#c9a37d" stroke-width="1.5" fill="none"/>
      <path d="M2 2 L160 112 L318 2" fill="#f7e8c4" stroke="#b9855a" stroke-width="2" stroke-linejoin="round"/>
      <g class="sealg">
        <circle cx="160" cy="112" r="27" fill="#b8325c"/>
        <circle cx="160" cy="112" r="21" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
        <path d="M160 124 C146 114 146 101 154 101 C157 101 159 103 160 105 C161 103 163 101 166 101 C174 101 174 114 160 124 Z" fill="none" stroke="#fff" stroke-width="1.8"/>
      </g>
    </svg>
  </button>
  <p class="tap">TAP THE SEAL TO OPEN &#10033;</p>
</section>

<section class="scene" id="s1">
  <div class="banner" id="banner"></div>
  <h2 id="wishTitle">Make a wish</h2>
  <div class="cake" id="cake">
    <div class="candles" id="candles"></div>
    <div class="glow"></div>
    <div class="guide"></div>
    <div class="cutline" id="cutline"></div><div class="spark" id="spark"></div>
    <div class="hand">👆</div>
  </div>
  <p class="hint" id="blowHint" style="margin-top:36px">Tap each flame to blow it out</p>
</section>

<section class="scene" id="s2">
  <div class="cardwrap">
    <div class="card">
      <div class="avatar-wrap"><img id="avatar" class="avatar" alt=""></div>
      <div class="badge"><span>&#9829;</span><b id="cardBadge" style="font-weight:500"></b></div>
      <h1 class="hello" id="cardTitle"></h1>
      <p class="hb"><span id="cardSub"></span> <span>&#9825;</span></p>
      <div class="divider"><i></i><span>&#10033;</span><i></i></div>
      <p class="cardtext" id="cardText"></p>
      <div class="player">
        <div class="cover"><img id="cover" alt=""></div>
        <div class="pinfo">
          <div class="ptitle" id="songTitle"></div>
          <div class="psub" id="songSub"></div>
          <div class="bar" id="bar"><i id="barFill"></i></div>
          <div class="times"><span id="tcur">0:00</span><span id="tdur">--</span></div>
        </div>
        <button class="pbtn" id="playBtn" aria-label="Play or pause">&#9654;</button>
      </div>
      <p class="note" id="songNote"></p>
    </div>
    <button class="btn replaybtn" id="replay">Replay &#8635;</button>
  </div>
</section>

<section class="scene" id="sp">
  <div class="lockbub">&#128272;</div>
  <h1 class="hello" id="passTitle"></h1>
  <p class="hb" id="passHint"></p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="sad" id="sad"><img id="sadImg" alt=""><p id="sadText"></p></div>
  <div class="pad" id="pad"></div>
</section>

<section class="scene on" id="si">
  <div class="lockbub">&#127873;</div>
  <div class="bubble" id="b1">
    <p id="q1"></p>
    <div class="row2"><button class="btn" id="y1">Yes</button><button class="btn ghost" id="n1">No</button></div>
  </div>
  <div class="bubble" id="b2" style="display:none">
    <p id="q2"></p>
    <div class="row2"><button class="btn" id="y2">Yes</button><button class="btn ghost" id="n2">No</button></div>
  </div>
</section>

<section class="scene" id="sl">
  <div class="eb"><svg viewBox="0 0 320 200"><rect x="2" y="2" width="316" height="196" rx="4" fill="#f1deb4" stroke="#b9855a" stroke-width="2"/></svg></div>
  <div class="paper" id="paper">
    <p class="lt-to" id="ltTo"></p>
    <div id="ltBody"></div>
    <p class="lt-from" id="ltFrom"></p>
    <button class="btn" id="ltBtn"></button>
  </div>
  <div class="ef"><svg viewBox="0 0 320 200"><path d="M2 44 L160 128 L318 44 V196 Q318 198 316 198 H4 Q2 198 2 196 Z" fill="#f7e8c4" stroke="#b9855a" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="160" cy="128" r="22" fill="#b8325c"/><path d="M160 139 C149 131 149 121 155 121 C157.500 121 159 122.500 160 124 C161 122.500 162.500 121 165 121 C171 121 171 131 160 139 Z" fill="none" stroke="#fff" stroke-width="1.6"/></svg></div>
</section>

}

}

    const a = Math.random()*6.28, s = Math.random()*9+3;
    bits.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,w:Math.random()*8+4,h:Math.random()*5+3,
      c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:1});
  }
}
function heartBurst(x, y, n = 36){
  const cols = ['#ff4f87','#ff7fab','#ffb3cb','#e03a76','#ffd6e4'];
  for (let i = 0; i < n; i++){
    const a = -Math.PI/2 + (Math.random()-.5)*2.6, s = Math.random()*7+3;
    bits.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,w:Math.random()*9+6,c:cols[i%cols.length],
      r:(Math.random()-.5)*.6,vr:(Math.random()-.5)*.05,life:1,d:.007,g:.06,heart:true});
  }
}
(function loop(){
  fctx.clearRect(0,0,W,H);
  bits = bits.filter(b => b.life > 0 && b.y < H+30);
  for (const b of bits){
    b.vy += (b.g ?? .22); b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life -= (b.d ?? .004);
    fctx.save(); fctx.translate(b.x,b.y); fctx.rotate(b.r); fctx.globalAlpha = Math.max(b.life,0);

const burstEls = [];
function burstPhotos(cx, cy){
  const srcs = (CONFIG.burstPhotos || []).slice(0, 6); if (!srcs.length) return;
  const w = Math.min(112, W * .27), h = w * 1.2, g = 2300;
  const floorBase = Math.min(H - h * .8, cy + H * .16);
  const items = [];
  srcs.forEach((src, i) => {
    const el = document.createElement('div'); el.className = 'burst';
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.innerHTML = '<div class="face front"><img alt=""></div><div class="face back"></div>';
    document.body.appendChild(el); burstEls.push(el);
    const spread = (i - (srcs.length - 1) / 2) / ((srcs.length - 1) / 2 || 1);
    const apex = H * (.30 + Math.random() * .16);
    const it = {el, w, h, x: cx, y: cy, vx: spread * W * .44 + (Math.random() - .5) * W * .10, vy: -Math.sqrt(2 * g * apex),
      rz: (Math.random() - .5) * 20, vrz: (Math.random() - .5) * 600, rx: 0,
      vrx: (Math.random() < .5 ? -1 : 1) * (240 + Math.random() * 360),
      floor: floorBase + (Math.random() - .5) * H * .08, bounces: 0, landed: false, rest: false, dead: false,
      t0: performance.now() + i * 60, ph: Math.random() * 6.28};
    el.querySelector('img').onerror = () => { it.dead = true; el.remove(); };
    el.querySelector('img').src = src;
    items.push(it);
  });
  let last = performance.now();
  (function step(now){
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    let active = false;
    for (const it of items){
      if (it.dead || it.rest) continue;
      active = true;
      if (now < it.t0) continue;
      it.el.style.opacity = 1;
      const age = (now - it.t0) / 1000;
      it.vy += g * dt;
      if (!it.landed) it.vx += Math.sin(age * 9 + it.ph) * 120 * dt;
      it.vx *= (1 - .6 * dt);
      it.x += it.vx * dt; it.y += it.vy * dt;
      it.rz += it.vrz * dt; it.rx += it.vrx * dt;
      if (it.y >= it.floor && it.vy > 0){
        it.y = it.floor; it.bounces++;
        if (it.bounces >= 3 || Math.abs(it.vy) < 260){ it.rest = true; it.vx = it.vy = 0; it.rx = Math.round(it.rx / 360) * 360; }
        else { it.vy *= -.34; it.vx *= .55; it.vrz *= .45; it.vrx = 0; it.landed = true; }
      }
      if (it.landed && !it.rest) it.rx += (Math.round(it.rx / 360) * 360 - it.rx) * Math.min(1, dt * 10);
      const s = Math.min(1, .3 + age * 3);
      it.el.style.transform = `perspective(800px) translate3d(${it.x - it.w/2}px,${it.y - it.h/2}px,0) rotateZ(${it.rz}deg) rotateX(${it.rx}deg) scale(${s})`;
    }
    if (active) requestAnimationFrame(step);
  })(last);
}
async function finishCut(){
  if (cutDone) return; cutDone = true; dragging = false;
  if (navigator.vibrate) navigator.vibrate(60);
  await wait(150);
  cake.classList.add('split');
  $('blowHint').style.opacity = 0;
  const r = cake.getBoundingClientRect();
  confetti(W/2, H*.5, 140); heartBurst(r.left + 120, r.top + 95, 60);
  burstPhotos(r.left + 120, r.top + 95);
  await wait(4300);
  burstEls.forEach(el => el.animate([{opacity:1},{opacity:0}], {duration:600, fill:'forwards'}));
  await wait(300); show(2); openCard();
  await wait(800); burstEls.forEach(el => el.remove());
}

/* ---------- Card page ---------- */
$('cardBadge').textContent = CONFIG.cardBadge;
$('cardTitle').textContent = CONFIG.cardTitle;
$('cardSub').textContent = CONFIG.cardSub;
$('cardText').textContent = CONFIG.cardText;
$('songTitle').textContent = CONFIG.songTitle;
$('songSub').textContent = CONFIG.songSub;
$('songNote').textContent = CONFIG.songNote;
const AV_SVG = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#fff"/><circle cx="50" cy="52" r="30" fill="#fff" stroke="#3b2f3a" stroke-width="2"/><path d="M38 48q4-4 8 0M54 48q4-4 8 0M46 57q4 3 8 0" stroke="#3b2f3a" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M50 80c-10-6-10-14-4-14 2 0 3 1 4 3 1-2 2-3 4-3 6 0 6 8-4 14z" fill="#e53950"/></svg>';
const av = $('avatar');
av.onerror = () => { const d = document.createElement('div'); d.className = 'avatar-fb'; d.innerHTML = AV_SVG; av.replaceWith(d); };
av.src = CONFIG.avatar;
const cov = $('cover');
cov.onerror = () => cov.replaceWith(document.createTextNode('\u266A'));
cov.src = CONFIG.songCover;

const au = $('audio'), pbtn = $('playBtn'), bar = $('bar');
const fmt = s => isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '--';
if (CONFIG.music) au.src = CONFIG.music;
pbtn.addEventListener('click', () => { if (!CONFIG.music) return; au.paused ? au.play().catch(() => {}) : au.pause(); });
au.addEventListener('play', () => pbtn.innerHTML = '&#10074;&#10074;');
au.addEventListener('pause', () => pbtn.innerHTML = '&#9654;');
au.addEventListener('loadedmetadata', () => $('tdur').textContent = fmt(au.duration));
au.addEventListener('timeupdate', () => {
  $('tcur').textContent = fmt(au.currentTime);
  if (isFinite(au.duration)) $('barFill').style.width = (au.currentTime / au.duration * 100) + '%';
});
bar.addEventListener('click', e => {
  if (!isFinite(au.duration)) return;
  const r = bar.getBoundingClientRect(); au.currentTime = au.duration * ((e.clientX - r.left) / r.width);
});
function openCard(){ if (CONFIG.music) au.play().catch(() => {}); }
/* ---------- Photo banner (hangs on the cake page) ---------- */
const banner = $('banner');
const photos = CONFIG.photos.map((src, i) => ({src, cap: CONFIG.captions[i] || '', ok: true}));
function buildBanner(){
  const list = photos.filter(p => p.ok), n = list.length, Wd = innerWidth, sag = 22;
  banner.innerHTML = '';
  if (!n) return;
  banner.innerHTML = `<svg width="${Wd}" height="${sag + 6}" viewBox="0 0 ${Wd} ${sag + 6}"><path d="M0 2Q${Wd/2} ${2*sag + 2} ${Wd} 2" fill="none" stroke="#fff6f9" stroke-width="2" stroke-linecap="round"/></svg>`;
  const w = Math.min(74, (Wd - 20) / n - 8);
  list.forEach((p, i) => {
    const t = (i + 1) / (n + 1), x = t * Wd, y = 2 + 4 * sag * t * (1 - t);
    const b = document.createElement('button');
    b.className = 'hang'; b.setAttribute('aria-label', 'Open photo ' + (i + 1));
    b.style.cssText = `left:${x - w/2}px;top:${y}px;width:${w}px;animation-delay:${-i * .7}s`;
    b.innerHTML = '<span class="pin"></span><span class="pol"><img alt=""></span>';
    const img = b.querySelector('img');
    img.onerror = () => { p.ok = false; buildBanner(); };
    img.src = p.src;
    b.addEventListener('click', () => {
      $('lbImg').src = p.src; $('lbCap').textContent = p.cap; $('lightbox').classList.add('on');
    });
    banner.appendChild(b);
  });
}
$('lightbox').addEventListener('click', () => $('lightbox').classList.remove('on'));
addEventListener('resize', buildBanner);
buildBanner();

$('replay').addEventListener('click', () => { location.hash = 'replay'; location.reload(); });
if (location.hash === '#replay') show(0);
